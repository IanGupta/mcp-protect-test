name: redaction-probe
on: [push, workflow_dispatch]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: direct-echo
        run: echo "direct: ${{ secrets.PROBE_SECRET }}"
      - name: env-var
        run: echo "envvar: $PROBE_SECRET"
        env:
          S: ${{ secrets.PROBE_SECRET }}
      - name: env-file
        run: |
          echo "S=$S" >> $GITHUB_ENV
        env:
          S: ${{ secrets.PROBE_SECRET }}
      - name: env-indirect
        run: echo "indirect: $S"
      - name: multiline-wrap
        run: echo "multi: X${S}Y"
        env:
          S: ${{ secrets.PROBE_SECRET }}