name: redaction-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: direct
        run: echo "direct: ${{ secrets.PROBE_SECRET }}"
      - name: envvar
        run: echo "envvar: $S"
        env:
          S: ${{ secrets.PROBE_SECRET }}
      - name: indirect
        run: echo "indirect: X${S}Y"
        env:
          S: ${{ secrets.PROBE_SECRET }}
